<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bag — Ajusti</title>
<meta name="description" content="Review your Ajusti bag and check out.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e9574e'/><text x='16' y='23' font-size='18' font-family='Georgia' fill='white' text-anchor='middle'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart.html">
<div data-shell="header"></div>

<div class="page-head">
  <div class="wrap">
    <h1>Your Bag</h1>
    <p class="crumbs"><a href="index.html">Home</a> / Bag</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="cart-layout" id="cartLayout">
      <div class="cart-list" id="cartList"></div>
      <aside class="summary">
        <h3 style="margin-top:0">Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><b id="sub">₦0</b></div>
        <div class="summary-row"><span>Delivery</span><b id="ship">₦0</b></div>
        <div class="summary-row"><span>Discount</span><b id="disc">−₦0</b></div>
        <div class="promo">
          <input id="promo" placeholder="Promo code (try AJUSTI10)" aria-label="Promo code">
          <button class="btn btn-dark btn-sm" id="applyPromo">Apply</button>
        </div>
        <div class="summary-row total"><span>Total</span><b id="total">₦0</b></div>
        <a class="btn btn-primary btn-block" href="checkout.html" style="margin-top:1rem">Proceed to Checkout</a>
        <a class="btn btn-ghost btn-block" href="shop.html" style="margin-top:.6rem">Continue Shopping</a>
        <a class="btn btn-ghost btn-block" id="orderWa" target="_blank" rel="noopener" style="margin-top:.6rem">Order on WhatsApp instead</a>
        <p class="muted" style="font-size:.8rem;margin-bottom:0">Free delivery on orders above ₦150,000. Pay on delivery available in Lagos.</p>
      </aside>
    </div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="sec-head"><div><h2>Complete the Look</h2></div></div>
    <div class="product-grid" id="suggest"></div>
  </div>
</section>

<div data-shell="footer"></div>

<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let promoOn = store.get('promo', false);
  window.WA_MESSAGE = 'Hi Ajusti, I have a question about my order.';

  function draw() {
    const list = document.getElementById('cartList');
    if (!cart.length) {
      document.getElementById('cartLayout').innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <h2>Your bag is empty</h2>
          <p>Nothing here yet — the Ankara rail is waiting.</p>
          <a class="btn btn-primary" href="shop.html">Start shopping</a>
        </div>`;
      return;
    }
    list.innerHTML = cart.map((l, i) => {
      const p = PRODUCTS.find(x => x.id === l.id);
      return `<div class="cart-row">
        <a href="product.html?id=${l.id}"><img src="${img(p)}" alt="${l.name}"></a>
        <div>
          <a href="product.html?id=${l.id}"><b>${l.name}</b></a>
          <div class="opt">Size ${l.size} · <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${l.color};vertical-align:middle"></span> colour</div>
          <div class="qty" style="margin-top:.5rem">
            <button data-q="-1" data-i="${i}">−</button><span>${l.qty}</span><button data-q="1" data-i="${i}">+</button>
          </div>
          <button class="rm" data-rm="${i}">Remove</button>
        </div>
        <b>${money(l.price * l.qty)}</b>
      </div>`;
    }).join('');

    const sub = cartTotal();
    const ship = sub >= 150000 || sub === 0 ? 0 : 5000;
    const disc = promoOn ? Math.round(sub * 0.10) : 0;
    document.getElementById('sub').textContent = money(sub);
    document.getElementById('ship').textContent = ship ? money(ship) : 'Free';
    document.getElementById('disc').textContent = '−' + money(disc);
    document.getElementById('total').textContent = money(sub + ship - disc);
    store.set('totals', { sub, ship, disc, total: sub + ship - disc });
  }

  document.addEventListener('click', e => {
    const q = e.target.closest('[data-q]');
    if (q) {
      const i = +q.dataset.i;
      cart[i].qty = Math.max(1, cart[i].qty + +q.dataset.q);
      saveCart(); draw(); return;
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) { cart.splice(+rm.dataset.rm, 1); saveCart(); draw(); toast('Removed from bag'); }
  });

  document.getElementById('applyPromo')?.addEventListener('click', () => {
    const code = document.getElementById('promo').value.trim().toUpperCase();
    if (code === 'AJUSTI10') { promoOn = true; store.set('promo', true); toast('AJUSTI10 applied — 10% off'); }
    else toast('That code is not valid');
    draw();
  });

  const waBtn = document.getElementById('orderWa');
  if (waBtn) waBtn.href = waLink(
    'Hi Ajusti, I would like to order:\n' +
    (cart.length
      ? cart.map(l => `• ${l.qty} × ${l.name} (size ${l.size}) — ${money(l.price * l.qty)}`).join('\n')
      : '(nothing in my bag yet)'));

  draw();
  renderGrid(document.getElementById('suggest'),
    PRODUCTS.filter(p => ['bags', 'shoes'].includes(p.cat)).slice(0, 4));
});
</script>
</body>
</html>
