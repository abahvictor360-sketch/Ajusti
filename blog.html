<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — Ajusti</title>
<meta name="description" content="Styling notes, fabric care and owambe dressing from the Ajusti journal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e9574e'/><text x='16' y='23' font-size='18' font-family='Georgia' fill='white' text-anchor='middle'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9574e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ajusti">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="blog.html">
<div data-shell="header"></div>

<div class="page-head">
  <div class="wrap">
    <h1>The Ajusti Journal</h1>
    <p class="crumbs"><a href="index.html">Home</a> / Blog</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="blog-grid" id="posts"></div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="newsletter">
      <h2>One good styling note a week</h2>
      <p>No spam, no daily blasts — just what we are wearing and how to care for it.</p>
      <form data-fake-submit="Subscribed — see you Thursday.">
        <input type="email" required placeholder="you@email.com" aria-label="Email address">
        <button class="btn btn-primary" type="submit">Subscribe</button>
      </form>
    </div>
  </div>
</section>

<div data-shell="footer"></div>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
const POSTS = [
  { k: 'Styling', t: 'Five ways to wear one Ankara gown', d: '12 Sep 2025', img: 'fuchsia-ruffle-highlow',
    x: 'A belt, a denim jacket, flat sandals — how one statement gown covers church, work drinks and a wedding without looking like the same outfit twice.' },
  { k: 'Fabric care', t: 'How to wash adire without losing the indigo', d: '04 Sep 2025', img: 'indigo-adire-flare-dress',
    x: 'Hand-dyed indigo bleeds for the first three washes. Cold water, salt on the first soak, and never leave it in the sun wet.' },
  { k: 'Owambe', t: 'What to wear to a Lagos introduction', d: '28 Aug 2025', img: 'turquoise-lace-boubou',
    x: 'Guest, aunty or asoebi — a plain guide to dressing for each role without upstaging the couple.' },
  { k: 'Measurements', t: 'Taking your own measurements properly', d: '19 Aug 2025', img: 'magenta-capelet-dress',
    x: 'Four numbers, one tape and a mirror. Do it over light clothing and write down the date — bodies change.' },
  { k: 'Men', t: 'Senator, agbada or kaftan: which and when', d: '10 Aug 2025', img: 'emerald-senator-suit',
    x: 'Friday mosque, office Fridays, weddings, burials — a straight answer on what each cut is actually for.' },
  { k: 'Accessories', t: 'Choosing a bag that survives Lagos traffic', d: '02 Aug 2025', img: 'black-classic-tote',
    x: 'Structured base, short handle drop, zip over magnet. What to check before you pay for leather.' }
];
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('posts').innerHTML = POSTS.map(p => `
    <article class="post">
      <img src="assets/products/${p.img}.jpg" alt="" loading="lazy">
      <div class="body">
        <span class="kicker">${p.k}</span>
        <h3>${p.t}</h3>
        <p class="muted" style="font-size:.9rem">${p.x}</p>
        <small class="muted">${p.d} · 4 min read</small>
      </div>
    </article>`).join('');
  document.querySelectorAll('[data-fake-submit]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault(); toast(f.dataset.fakeSubmit); f.reset();
  }));
});
</script>
</body>
</html>
