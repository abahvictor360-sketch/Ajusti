<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Ajusti</title>
<meta name="description" content="Sign in to your Ajusti account to track orders and manage addresses.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e9574e'/><text x='16' y='23' font-size='18' font-family='Georgia' fill='white' text-anchor='middle'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account.html">
<div data-shell="header"></div>

<div class="page-head">
  <div class="wrap">
    <h1>My Account</h1>
    <p class="crumbs"><a href="index.html">Home</a> / Account</p>
  </div>
</div>

<section>
  <div class="wrap" style="max-width:940px">
    <div class="two-col" style="gap:2rem;align-items:start">
      <form class="card" data-fake-submit="Demo store — sign-in is not wired up yet.">
        <h3 style="margin-top:0">Sign in</h3>
        <div class="field"><label for="e1">Email</label><input id="e1" type="email" required></div>
        <div class="field"><label for="p1">Password</label><input id="p1" type="password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        <p class="muted center" style="font-size:.85rem;margin-bottom:0">Forgot your password? <a href="contact.html" style="color:var(--coral)">Ask us</a></p>
      </form>
      <form class="card" data-fake-submit="Thanks — we'll set your account up and email you.">
        <h3 style="margin-top:0">Create an account</h3>
        <div class="field"><label for="n2">Full name</label><input id="n2" required></div>
        <div class="field"><label for="e2">Email</label><input id="e2" type="email" required></div>
        <div class="field"><label for="w2">WhatsApp number</label><input id="w2" type="tel" required placeholder="+234…"></div>
        <button class="btn btn-dark btn-block" type="submit">Create account</button>
      </form>
    </div>

    <div class="card" style="margin-top:2rem">
      <h3 style="margin-top:0">Track an order</h3>
      <form class="two-col" data-fake-submit="Order not found in this demo — try AJ-XXXXX from a real order email.">
        <div class="field" style="margin-bottom:0"><label for="ref">Order reference</label><input id="ref" placeholder="AJ-…" required></div>
        <div class="field" style="margin-bottom:0;display:flex;align-items:flex-end"><button class="btn btn-primary" type="submit">Track order</button></div>
      </form>
    </div>
  </div>
</section>

<div data-shell="footer"></div>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-fake-submit]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault(); toast(f.dataset.fakeSubmit);
  }));
});
</script>
</body>
</html>
